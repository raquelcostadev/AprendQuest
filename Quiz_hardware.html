<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Hardware - Aprend Quest</title>
    <link rel="stylesheet" href="Quiz_hardware.css">
</head>
<body>

    <section id="quiz-screen" class="screen active">
        <div class="web-card">
            <!-- 1. INSIRA O BADGE DE NÍVEL E PX AQUI (NO TOPO) -->
        <div class="user-progress-badge">
            <span id="user-level" class="level-tag">Nível 1</span>
            <span id="user-px" class="px-tag">⚡ 0 / 100 PX</span>
        </div>


            <h2 id="quiz-question-counter" class="quiz-counter-title">Pergunta 1 de 5</h2>

            <div class="progress-bar-container">
                <div id="quiz-progress-fill" class="progress-bar-fill" style="width: 20%;">
                    <span id="quiz-progress-text">20%</span>
                </div>
            </div>

            <!-- CAIXA DE FEEDBACK LÚDICA (MENSAGENS/ALERTAS) -->
            <div id="feedback-box" class="feedback-box hidden">
                <span id="feedback-icon" class="feedback-icon">💡</span>
                <p id="feedback-text" class="feedback-text"></p>
            </div>

            <p id="quiz-question-text" class="quiz-question-text">
                Carregando pergunta...
            </p>

            <div id="quiz-options-container" class="quiz-options-grid">
                <!-- Gerado via JS -->
            </div>

            <button id="btn-confirm-answer" type="button" class="btn-green-round" onclick="confirmAnswer()" disabled>
                Confirmar Resposta
            </button>
        </div>
    </section>

    <!-- 1. IMPORTANTE: Conecta a lógica do quiz -->
    <script src="Quiz_hardware.js"></script>

    <script>
        // Exemplo de para onde ir quando o quiz de hardware terminar
        function goToNextModule() {
            window.location.href = "organizacao.html"; 
        }
    </script>
</body>
</html>
